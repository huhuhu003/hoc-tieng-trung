  <script>
// engine.js

function createPRNG(seedStr) {
  let h = 0;
  for (let i = 0; i < seedStr.length; i++) {
    h = Math.imul(31, h) + seedStr.charCodeAt(i) | 0;
  }
  let a = h ^ 0xDEADBEEF;
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

function shuffle(array, prng = Math.random) {
  const result = [...array];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(prng() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function mulChoice(word, vocab, type) {
  const isPinyin = type === "hanzi->pinyin" || type === "pinyin->hanzi";
  const isMeaning = type === "hanzi->meaning" || type === "meaning->hanzi";
  
  let pool = vocab.filter(v => v.id !== word.id);
  
  pool.forEach(v => {
    let score = 0;
    if (v.topic === word.topic) score += 10;
    if (isPinyin) {
      if (v.pinyin.length === word.pinyin.length) score += 5;
      if (v.pinyin.charAt(0) === word.pinyin.charAt(0)) score += 5;
    }
    if (isMeaning) {
       score += Math.random() * 5;
    }
    score += Math.random(); 
    v._score = score;
  });
  
  pool.sort((a, b) => b._score - a._score);
  
  const distractors = [];
  const seenOptions = new Set();
  
  let targetVal = "";
  if (type === "hanzi->meaning") targetVal = word.meaning_vi;
  else if (type === "meaning->hanzi") targetVal = word.hanzi;
  else if (type === "hanzi->pinyin") targetVal = word.pinyin;
  else if (type === "pinyin->hanzi") targetVal = word.hanzi;
  
  seenOptions.add(targetVal);

  for (const v of pool) {
      let optVal = "";
      if (type === "hanzi->meaning") optVal = v.meaning_vi;
      else if (type === "meaning->hanzi") optVal = v.hanzi;
      else if (type === "hanzi->pinyin") optVal = v.pinyin;
      else if (type === "pinyin->hanzi") optVal = v.hanzi;
      
      if (!seenOptions.has(optVal)) {
          seenOptions.add(optVal);
          distractors.push(v);
          if (distractors.length === 3) break;
      }
  }
  
  if (distractors.length < 3) {
      for (let i = 0; i < 3 - distractors.length; i++) {
          distractors.push({ id: `fake_${i}`, hanzi: `Fake${i}`, pinyin: `fake${i}`, meaning_vi: `Fake Meaning ${i}`});
      }
  }

  const optionsPool = [word, ...distractors];
  const shuffledOptions = shuffle(optionsPool);
  const answerIndex = shuffledOptions.findIndex(v => v.id === word.id);
  
  let question = "";
  let options = [];
  
  switch(type) {
    case "hanzi->meaning":
      question = word.hanzi;
      options = shuffledOptions.map(v => v.meaning_vi);
      break;
    case "meaning->hanzi":
      question = word.meaning_vi;
      options = shuffledOptions.map(v => v.hanzi);
      break;
    case "hanzi->pinyin":
      question = word.hanzi;
      options = shuffledOptions.map(v => v.pinyin);
      break;
    case "pinyin->hanzi":
      question = word.pinyin;
      options = shuffledOptions.map(v => v.hanzi);
      break;
  }
  
  return { question, options, answerIndex };
}

function toneQuiz(word) {
  const pinyin = word.pinyin;
  
  const toneMap = {
    'ā':'a', 'á':'a', 'ǎ':'a', 'à':'a',
    'ē':'e', 'é':'e', 'ě':'e', 'è':'e',
    'ī':'i', 'í':'i', 'ǐ':'i', 'ì':'i',
    'ō':'o', 'ó':'o', 'ǒ':'o', 'ò':'o',
    'ū':'u', 'ú':'u', 'ǔ':'u', 'ù':'u',
    'ǖ':'v', 'ǘ':'v', 'ǚ':'v', 'ǜ':'v'
  };
  
  let toneless = pinyin;
  for (const [mark, plain] of Object.entries(toneMap)) {
    toneless = toneless.replace(new RegExp(mark, 'g'), plain);
  }
  
  const variants = [pinyin];
  
  const applyRandomTones = (text, seed) => {
    let res = text;
    const vowels = ['a','e','i','o','u','v'];
    const tonesA = ['ā', 'á', 'ǎ', 'à'];
    const tonesE = ['ē', 'é', 'ě', 'è'];
    const tonesI = ['ī', 'í', 'ǐ', 'ì'];
    const tonesO = ['ō', 'ó', 'ǒ', 'ò'];
    const tonesU = ['ū', 'ú', 'ǔ', 'ù'];
    
    for (let i=0; i<res.length; i++) {
        if (vowels.includes(res[i])) {
            let choice = (seed + i) % 4;
            if (res[i] === 'a') res = res.substring(0, i) + tonesA[choice] + res.substring(i+1);
            else if (res[i] === 'e') res = res.substring(0, i) + tonesE[choice] + res.substring(i+1);
            else if (res[i] === 'i') res = res.substring(0, i) + tonesI[choice] + res.substring(i+1);
            else if (res[i] === 'o') res = res.substring(0, i) + tonesO[choice] + res.substring(i+1);
            else if (res[i] === 'u') res = res.substring(0, i) + tonesU[choice] + res.substring(i+1);
            break;
        }
    }
    return res;
  };

  let attempt = 0;
  while (variants.length < 4 && attempt < 20) {
      let variant = applyRandomTones(toneless, attempt);
      if (!variants.includes(variant)) {
          variants.push(variant);
      }
      attempt++;
  }
  
  while(variants.length < 4) {
      variants.push(toneless + " " + variants.length);
  }

  const shuffledOptions = shuffle(variants);
  const answerIndex = shuffledOptions.indexOf(pinyin);
  
  return { toneless, options: shuffledOptions, answerIndex };
}

function srsNext(state, correct) {
  let box = state?.box ?? 0;
  const intervals = [1, 2, 4, 8, 16, 32]; 
  
  if (correct) {
    box = Math.min(box + 1, 5);
  } else {
    box = 0;
  }
  
  let days = correct ? intervals[box] : 1;
  const nextReviewDate = new Date();
  nextReviewDate.setDate(nextReviewDate.getDate() + days);
  
  const yyyy = nextReviewDate.getFullYear();
  const mm = String(nextReviewDate.getMonth() + 1).padStart(2, '0');
  const dd = String(nextReviewDate.getDate()).padStart(2, '0');
  
  return { box, nextReview: `${yyyy}-${mm}-${dd}` };
}

function dailySet(vocab, states, dateStr) {
  const prng = createPRNG(dateStr);
  const totalItems = 20;
  
  let dueWords = [];
  let newWords = [];
  
  for (const word of vocab) {
    const state = states[word.id];
    if (!state || state.nextReview <= dateStr) {
        if (!state || state.box === 0) {
            newWords.push(word);
        } else {
            dueWords.push(word);
        }
    }
  }
  
  dueWords = shuffle(dueWords, prng);
  newWords = shuffle(newWords, prng);
  
  let selected = [];
  const dueQuota = Math.floor(totalItems * 0.6);
  const newQuota = totalItems - dueQuota;
  
  selected.push(...dueWords.slice(0, dueQuota));
  selected.push(...newWords.slice(0, newQuota));
  
  const remaining = totalItems - selected.length;
  if (remaining > 0) {
      let pool = vocab.filter(v => !selected.find(s => s.id === v.id));
      pool = shuffle(pool, prng);
      selected.push(...pool.slice(0, remaining));
  }
  
  selected = shuffle(selected, prng);
  
  const result = [];
  const types = ["hanzi->meaning", "meaning->hanzi", "hanzi->pinyin", "pinyin->hanzi"];
  let typeIndex = 0;
  
  for (const word of selected) {
      const kindProb = prng();
      if (kindProb < 0.5) {
          result.push({
              kind: "mulChoice",
              wordId: word.id,
              type: types[typeIndex % types.length]
          });
          typeIndex++;
      } else {
          result.push({
              kind: "toneQuiz",
              wordId: word.id
          });
      }
  }
  
  return result;
}

function sentenceQuiz(s, sentences) {
  const answerVi = s.vi;
  const targetLen = answerVi.length;
  let pool = sentences.filter(v => v.id !== s.id);
  
  pool.forEach(v => {
    let lenDiff = Math.abs(v.vi.length - targetLen) / targetLen;
    let score = Math.random();
    if (lenDiff <= 0.4) score += 10;
    v._score = score;
  });
  
  pool.sort((a, b) => b._score - a._score);
  
  const distractors = [];
  const seenOptions = new Set([answerVi]);
  
  for (const v of pool) {
    if (!seenOptions.has(v.vi)) {
      seenOptions.add(v.vi);
      distractors.push(v.vi);
      if (distractors.length === 3) break;
    }
  }
  
  while (distractors.length < 3) {
    const fake = "Fake " + Math.random();
    distractors.push(fake);
    seenOptions.add(fake);
  }
  
  const optionsPool = [answerVi, ...distractors];
  const shuffledOptions = shuffle(optionsPool);
  const answerIndex = shuffledOptions.indexOf(answerVi);
  
  return {
    prompt: s.zh,
    promptPinyin: s.pinyin,
    options: shuffledOptions,
    answerIndex
  };
}

function passageQuiz(passage) {
  return passage.questions.map(q => ({
    question: q.q_zh + " / " + q.q_vi,
    options: q.options.slice(),
    answerIndex: q.answer
  }));
}

window.Engine = { mulChoice, toneQuiz, dailySet, srsNext, sentenceQuiz, passageQuiz };

</script>

        const py=el('p','pinyin',s.quiz.promptPinyin);py.hidden=!s.pinyin;
        const toggle=button(s.pinyin?'Ẩn pinyin':'Hiện pinyin','secondary',()=>{ s.pinyin=!s.pinyin;py.hidden=!s.pinyin;toggle.textContent=s.pinyin?'Ẩn pinyin':'Hiện pinyin';toggle.setAttribute('aria-expanded',String(s.pinyin)); });toggle.setAttribute('aria-expanded',String(s.pinyin));
        card.append(el('p','instruction','Chọn nghĩa tiếng Việt phù hợp.'),zh,py,toggle);
      } else {
        word=daily[s.index]; const type=tab==='listen'?'pinyin->hanzi':modes[s.index%4];
        if (!s.quiz) s.quiz=Engine.mulChoice(word,VOCAB,type);
        detail=`${word.hanzi} · ${word.pinyin} · ${word.meaning_vi}`;
        if (tab==='listen') {
          const status=el('p','hint','Bấm Nghe để mở các đáp án.');status.setAttribute('role','status');
          const listen=button(s.heard?'▶ Nghe lại':'▶ Nghe','primary listen',()=>{ s.heard=true;options.hidden=false;listen.textContent='▶ Nghe lại';speak(word.hanzi,status); });
          card.append(el('p','instruction','Nghe phát âm rồi chọn chữ Hán đúng.'),listen,status);
        } else card.append(el('p','instruction',`Chọn ${type.endsWith('meaning')?'nghĩa tiếng Việt':type.endsWith('pinyin')?'pinyin':'chữ Hán'} phù hợp.`),el('div',type.startsWith('hanzi')?'hanzi':type.startsWith('pinyin')?'pinyin':'meaning',s.quiz.question));
      }
      const options=el('div','options');options.hidden=tab==='listen'&&!s.heard;
      const feedback=el('p','feedback');feedback.setAttribute('role','status');
      const next=button('Câu tiếp theo →','primary',()=>{s.index++;s.quiz=null;s.answered=false;s.heard=false;save();render();}); next.hidden=!s.answered;
      s.quiz.options.forEach((label,i)=>{const n=button('','option',()=>{
        if(s.answered)return;const correct=i===s.quiz.answerIndex;record(correct,word);s.feedback=`${correct?'Chính xác!':'Chưa đúng.'} ${detail || 'Đáp án: '+s.quiz.options[s.quiz.answerIndex]}`;s.selected=i;save();paint();
      });n.append(el('span','',i+1),el('span','',label));options.append(n);});
      function paint(){ if(!s.answered)return;Array.from(options.children).forEach((n,i)=>{n.disabled=true;n.classList.toggle('correct',i===s.quiz.answerIndex);n.classList.toggle('wrong',i===s.selected&&i!==s.quiz.answerIndex);});feedback.textContent=s.feedback;next.hidden=false; }
      paint();main.append(card,options,feedback,next);
    } catch(e) { main.replaceChildren(el('section','card empty',`Chưa thể mở bài học: ${e.message}`)); }
  }
  function selectTab(value) {
    tab=value;document.querySelectorAll('[data-tab]').forEach(n=>{n.classList.toggle('active',n.dataset.tab===tab);if(n.dataset.tab===tab)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current');});render();
  }
  document.querySelectorAll('[data-tab]').forEach(n=>n.addEventListener('click',()=>selectTab(n.dataset.tab)));
  render();
})();

</script>
</body>
</html>
